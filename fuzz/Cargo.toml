[package]
name = "qubit-value-fuzz"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
qubit-budget = { version = "0.3", features = ["json"] }
qubit-json = { path = "../../rs-json" }
qubit-value = { path = "..", features = ["all"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
bigdecimal = "0.4"
chrono = { version = "0.4", default-features = false, features = ["std"] }
num-bigint = "0.4"
url = "2.5"

[[bin]]
name = "bounded_value_wire_v1"
path = "fuzz_targets/bounded_value_wire_v1.rs"
test = false
doc = false
bench = false

[[bin]]
name = "structured_value_wire_v1"
path = "fuzz_targets/structured_value_wire_v1.rs"
test = false
doc = false
bench = false
