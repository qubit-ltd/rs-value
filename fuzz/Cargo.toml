[package]
name = "qubit-value-fuzz"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
qubit-value = { path = "..", features = ["all"] }
serde_json = "1.0"

[[bin]]
name = "deserialize_value_container"
path = "fuzz_targets/deserialize_value_container.rs"
test = false
doc = false
bench = false

[[bin]]
name = "round_trip_value_container"
path = "fuzz_targets/round_trip_value_container.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bounded_value_wire_v1"
path = "fuzz_targets/bounded_value_wire_v1.rs"
test = false
doc = false
bench = false
