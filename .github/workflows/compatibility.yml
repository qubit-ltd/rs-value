name: API and downstream compatibility

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.94.0"
  QUBIT_CONFIG_REVISION: 8daf6c2596c66a0e8487bfe36a7dc265d58f6953
  QUBIT_METADATA_REVISION: 33f13edad527e483d480e3c497adb133419a519a

jobs:
  rs-config:
    name: rs-config (${{ matrix.feature_mode }} features)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        feature_mode: [minimal, all]
    steps:
      - name: Checkout rs-value
        uses: actions/checkout@v6
        with:
          path: workspace/rs-value

      - name: Checkout rs-config
        uses: actions/checkout@v6
        with:
          repository: qubit-ltd/rs-config
          ref: ${{ env.QUBIT_CONFIG_REVISION }}
          path: workspace/rs-config

      - name: Install Rust
        run: rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal

      - name: Verify rs-value checkout dependency
        working-directory: workspace/rs-config
        env:
          EXPECTED_RS_VALUE_ROOT: ${{ github.workspace }}/workspace/rs-value
        run: |
          metadata_file="$(mktemp)"
          trap 'rm -f "$metadata_file"' EXIT
          cargo +${RUST_TOOLCHAIN} metadata --locked --format-version 1 > "$metadata_file"
          EXPECTED_RS_VALUE_ROOT="$EXPECTED_RS_VALUE_ROOT" python3 - "$metadata_file" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          metadata = json.loads(Path(sys.argv[1]).read_text())
          expected = (Path(os.environ["EXPECTED_RS_VALUE_ROOT"]) / "Cargo.toml").resolve()
          values = [package for package in metadata["packages"] if package["name"] == "qubit-value"]
          assert len(values) == 1, "expected exactly one qubit-value dependency"
          actual = Path(values[0]["manifest_path"]).resolve()
          assert actual == expected, f"qubit-value resolved to {actual}, expected {expected}"
          PY

      - name: Test rs-config
        working-directory: workspace/rs-config
        run: cargo +${RUST_TOOLCHAIN} test --locked ${{ matrix.feature_mode == 'minimal' && '--no-default-features' || '--all-features' }}

  rs-metadata:
    name: rs-metadata (${{ matrix.feature_mode }} features)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        feature_mode: [minimal, all]
    steps:
      - name: Checkout rs-value
        uses: actions/checkout@v6
        with:
          path: workspace/rs-value

      - name: Checkout rs-metadata
        uses: actions/checkout@v6
        with:
          repository: qubit-ltd/rs-metadata
          ref: ${{ env.QUBIT_METADATA_REVISION }}
          path: workspace/rs-metadata

      - name: Install Rust
        run: rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal

      - name: Verify rs-value checkout dependency
        working-directory: workspace/rs-metadata
        env:
          EXPECTED_RS_VALUE_ROOT: ${{ github.workspace }}/workspace/rs-value
        run: |
          metadata_file="$(mktemp)"
          trap 'rm -f "$metadata_file"' EXIT
          cargo +${RUST_TOOLCHAIN} metadata --locked --format-version 1 > "$metadata_file"
          EXPECTED_RS_VALUE_ROOT="$EXPECTED_RS_VALUE_ROOT" python3 - "$metadata_file" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          metadata = json.loads(Path(sys.argv[1]).read_text())
          expected = (Path(os.environ["EXPECTED_RS_VALUE_ROOT"]) / "Cargo.toml").resolve()
          values = [package for package in metadata["packages"] if package["name"] == "qubit-value"]
          assert len(values) == 1, "expected exactly one qubit-value dependency"
          actual = Path(values[0]["manifest_path"]).resolve()
          assert actual == expected, f"qubit-value resolved to {actual}, expected {expected}"
          PY

      - name: Test rs-metadata
        working-directory: workspace/rs-metadata
        run: cargo +${RUST_TOOLCHAIN} test --locked ${{ matrix.feature_mode == 'minimal' && '--no-default-features' || '--all-features' }}
