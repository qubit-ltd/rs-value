name: Value writer compatibility
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  value-writer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        run: rustup toolchain install 1.94.0 --profile minimal
      - name: Prepare local path dependencies
        run: ./.infra/bin/prepare-local-path-dependencies.sh
      - name: Check minimal JSON API
        run: cargo +1.94.0 check --locked --no-default-features --features json --lib
      - name: Test writer contracts
        run: cargo +1.94.0 test --locked --all-features --test integration_tests writer
