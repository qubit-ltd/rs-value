name: Downstream compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  downstream:
    name: ${{ matrix.name }} compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: rs-config
            repository: qubit-ltd/rs-config
            revision: 8937f6121c7aeefa95e78280e11091bbd18d5803
            directory: rs-config
          - name: rs-metadata
            repository: qubit-ltd/rs-metadata
            revision: 2d90910164b49d4a2e280e130e46b99a449b5122
            directory: rs-metadata

    steps:
      - name: Check out candidate rs-value
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: rs-value

      - name: Check out downstream project
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.revision }}
          path: ${{ matrix.directory }}

      - name: Check out rs-redact path dependency
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: qubit-ltd/rs-redact
          ref: 8d437767dcc0dd3085a8aaac6a27a34347c94807
          path: rs-redact

      - name: Install Rust
        run: rustup toolchain install 1.94.0 --profile minimal

      - name: Prepare and inspect temporary lockfile
        working-directory: ${{ matrix.directory }}
        env:
          DOWNSTREAM_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          cp Cargo.lock "$RUNNER_TEMP/Cargo.lock.before"
          cargo +1.94.0 metadata --format-version 1 > "$RUNNER_TEMP/cargo-metadata-before-check.json"
          git diff -- Cargo.lock
          python3 - "$RUNNER_TEMP/Cargo.lock.before" Cargo.lock "$DOWNSTREAM_NAME" <<'PY'
          import pathlib
          import sys
          import tomllib

          before_path = pathlib.Path(sys.argv[1])
          after_path = pathlib.Path(sys.argv[2])
          before = tomllib.loads(before_path.read_text())
          after = tomllib.loads(after_path.read_text())
          project = sys.argv[3]
          before_top_level = {key: value for key, value in before.items() if key != "package"}
          after_top_level = {key: value for key, value in after.items() if key != "package"}
          if before_top_level != after_top_level:
              raise SystemExit("unexpected Cargo.lock top-level change")

          def key(package):
              return package["name"], package["version"], package.get("source")

          old = {key(package): package for package in before["package"]}
          new = {key(package): package for package in after["package"]}
          added = set(new) - set(old)
          removed = set(old) - set(new)
          expected_registry_redact = (
              "qubit-redact",
              "0.10.0",
              "registry+https://github.com/rust-lang/crates.io-index",
          )

          if project == "rs-config" and before_path.read_bytes() == after_path.read_bytes():
              print("Cargo.lock unchanged for rs-config")
              raise SystemExit(0)

          if project != "rs-metadata" or added != {expected_registry_redact} or removed:
              raise SystemExit(f"unexpected path-dependency lock change: added={added}, removed={removed}")

          path_redact = ("qubit-redact", "0.10.0", None)
          metadata_package = ("qubit-metadata", "0.7.0", None)
          value_package = ("qubit-value", "0.13.0", None)
          path_reference = "qubit-redact 0.10.0"
          registry_reference = "qubit-redact 0.10.0 (registry+https://github.com/rust-lang/crates.io-index)"
          if old[path_redact]["dependencies"] != ["qubit-budget", "qubit-json", "serde", "serde_json"]:
              raise SystemExit("unexpected original qubit-redact dependency set")
          if new[path_redact]["dependencies"] != ["qubit-budget"]:
              raise SystemExit("unexpected path qubit-redact dependency set")
          registry_redact = new[expected_registry_redact]
          if registry_redact.get("checksum") != "ed3fa4e8064f159e9facdad5e0c12eb35ed8b4d7ccca59a8446f28e2aeff1de0":
              raise SystemExit("unexpected registry qubit-redact checksum")
          if registry_redact["dependencies"] != old[path_redact]["dependencies"]:
              raise SystemExit("registry qubit-redact dependency set changed")

          def normalize(package, package_key):
              normalized = dict(package)
              if "dependencies" in normalized:
                  if package_key == metadata_package:
                      normalized["dependencies"] = [
                          "qubit-redact" if dependency == path_reference else dependency
                          for dependency in normalized["dependencies"]
                      ]
                  elif package_key == value_package:
                      normalized["dependencies"] = [
                          "qubit-redact" if dependency == registry_reference else dependency
                          for dependency in normalized["dependencies"]
                      ]
              return normalized

          for package_key in set(old) & set(new):
              if package_key != path_redact and normalize(old[package_key], package_key) != normalize(new[package_key], package_key):
                  raise SystemExit(f"unrelated Cargo.lock package changed: {package_key}")
          print("Cargo.lock delta is limited to splitting the local and registry qubit-redact packages")
          PY

      - name: Verify candidate dependency resolution
        working-directory: ${{ matrix.directory }}
        env:
          DOWNSTREAM_NAME: ${{ matrix.name }}
          VALUE_REVISION: ${{ github.sha }}
          DOWNSTREAM_REVISION: ${{ matrix.revision }}
        run: |
          set -euo pipefail
          value_revision=$(git -C ../rs-value rev-parse HEAD)
          downstream_revision=$(git rev-parse HEAD)
          echo "rs-value revision: $value_revision (event $VALUE_REVISION)"
          echo "$DOWNSTREAM_NAME revision: $downstream_revision (expected $DOWNSTREAM_REVISION)"
          test "$value_revision" = "$VALUE_REVISION"
          test "$downstream_revision" = "$DOWNSTREAM_REVISION"
          cargo +1.94.0 metadata --locked --format-version 1 > "$RUNNER_TEMP/cargo-metadata.json"
          python3 - "$RUNNER_TEMP/cargo-metadata.json" <<'PY'
          import json
          import pathlib
          import sys

          metadata = json.loads(pathlib.Path(sys.argv[1]).read_text())
          expected = pathlib.Path("../rs-value/Cargo.toml").resolve()
          packages = [package for package in metadata["packages"] if package["name"] == "qubit-value"]
          if len(packages) != 1:
              raise SystemExit(f"expected exactly one qubit-value package, found {len(packages)}")
          actual = pathlib.Path(packages[0]["manifest_path"]).resolve()
          print(f"resolved qubit-value manifest: {actual}")
          if actual != expected:
              raise SystemExit(f"expected {expected}, resolved {actual}")
          PY

      - name: Test default feature profile
        working-directory: ${{ matrix.directory }}
        run: cargo +1.94.0 test --locked

      - name: Test all feature profile
        working-directory: ${{ matrix.directory }}
        run: cargo +1.94.0 test --locked --all-features
