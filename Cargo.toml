[package]
name = "qubit-value"
version = "0.10.0"
edition = "2024"
rust-version = "1.94"
autotests = false
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-value"
description = "Type-safe containers for single, multi-valued, and named runtime values"
homepage = "https://github.com/qubit-ltd/rs-value"
documentation = "https://docs.rs/qubit-value"
readme = "README.md"
keywords = ["value", "container", "type-safe", "serde", "qubit"]
categories = ["data-structures", "config", "development-tools"]
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/README.zh_CN.md",
    "/RUST_CODING_STYLE.md",
    "/RUST_CODING_STYLE.zh_CN.md",
    "/doc/**/user_guide*.md",
    "/examples/**",
    "/resources/**",
    "/src/**",
    "/tests/**",
]

[lib]
name = "qubit_value"
doctest = true

[package.metadata.docs.rs]
all-features = true

[[test]]
name = "integration_tests"
path = "tests/mod.rs"
required-features = ["all"]

[[test]]
name = "core_feature_tests"
path = "tests/core_feature_tests.rs"

[[test]]
name = "feature_contract_tests"
path = "tests/feature_contract_tests.rs"

[features]
default = []
chrono = ["dep:chrono", "qubit-datatype/chrono"]
big-number = [
    "dep:bigdecimal",
    "dep:num-bigint",
    "qubit-datatype/big-number",
]
url = ["dep:url", "qubit-datatype/url"]
json = ["dep:serde_json", "qubit-datatype/json"]
converter = ["qubit-datatype/converter"]
all = ["converter", "chrono", "big-number", "url", "json"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
serde_json = { version = "1.0", optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }
url = { version = "2.5", features = ["serde"], optional = true }
num-bigint = { version = "0.4", optional = true }
bigdecimal = { version = "0.4", optional = true }

qubit-datatype = { path = "../rs-datatype", version = "0.6", default-features = false }

[dev-dependencies]
serde_json = "1.0"
