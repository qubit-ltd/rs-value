[package]
name = "qubit-value"
version = "0.10.0"
edition = "2024"
rust-version = "1.94"
autotests = false
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-value"
description = "Type-safe containers for single, multi-valued, and named runtime values"
homepage = "https://github.com/qubit-ltd/rs-value"
documentation = "https://docs.rs/qubit-value"
readme = "README.md"
keywords = ["value", "container", "type-safe", "serde", "qubit"]
categories = ["data-structures", "config", "development-tools"]
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/README.zh_CN.md",
    "/benches/**",
    "/doc/**/user_guide*.md",
    "/src/**",
    "/tests/**",
    "/.github/workflows/ci.yml",
    "/.github/workflows/fuzz.yml",
]

[package.metadata.rs-ci]
package-include-extra = [
    "/.github/workflows/ci.yml",
    "/.github/workflows/fuzz.yml",
]

[lib]
name = "qubit_value"
doctest = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)"] }

[[test]]
name = "integration_tests"
path = "tests/mod.rs"
required-features = ["all"]

[[test]]
name = "core_feature_tests"
path = "tests/core_feature_tests.rs"

[[test]]
name = "feature_contract_tests"
path = "tests/feature_contract_tests.rs"

[features]
default = []
chrono = ["dep:chrono", "qubit-datatype/chrono"]
big-integer = [
    "dep:num-bigint",
    "qubit-datatype/big-integer",
]
big-decimal = [
    "dep:bigdecimal",
    "dep:num-bigint",
    "qubit-datatype/big-decimal",
]
big-number = ["big-integer", "big-decimal"]
url = ["dep:url", "qubit-datatype/url"]
json = [
    "dep:qubit-budget",
    "dep:serde_json",
    "dep:qubit-json",
    "qubit-datatype/json",
    "qubit-redact?/json",
]
# Natural JSON is the ordinary `serde_json::Value` projection.  Keep it
# separate from the versioned JSON wire representation exposed by `json`.
natural-json = ["converter", "json"]
converter = ["qubit-datatype/converter"]
redact = ["dep:qubit-redact"]
all = [
    "converter",
    "chrono",
    "big-number",
    "url",
    "json",
    "natural-json",
    "redact",
]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
qubit-budget = { version = "0.4", features = ["json"], optional = true }
qubit-json = { version = "0.8", path = "../rs-json", optional = true }
serde_json = { version = "1.0", features = ["float_roundtrip"], optional = true }
chrono = { version = "0.4", default-features = false, features = ["std", "serde"], optional = true }
url = { version = "2.5", features = ["serde"], optional = true }
num-bigint = { version = "0.4", optional = true }
bigdecimal = { version = "0.4", optional = true }

qubit-datatype = { version = "0.12", path = "../rs-datatype", default-features = false }
qubit-redact = { version = "0.5", path = "../rs-redact", default-features = false, optional = true }

[dev-dependencies]
criterion = { version = "0.8", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["std"] }
qubit-budget = { version = "0.4", features = ["json"] }
serde_json = "1.0"

[[bench]]
name = "value_container_add_bench"
harness = false

[[bench]]
name = "downstream_read_bench"
harness = false
required-features = ["natural-json"]

[[bench]]
name = "value_identity_bench"
harness = false
required-features = ["big-decimal", "json"]
